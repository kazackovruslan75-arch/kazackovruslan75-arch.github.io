name: Build iOS IPA

on:
  push:
    branches: [dotify-ios]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS project
        run: |
          flutter --version
          flutter create --org com.dotify --project-name dotify --platforms ios .

      - name: Dependencies
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Configure Info.plist (background audio, name)
        run: |
          P=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" $P || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" $P
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" $P
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Dotify" $P || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Dotify" $P
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" $P || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $P || true
          cat $P

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p out/Payload
          cp -R build/ios/iphoneos/Runner.app out/Payload/
          cd out && zip -qr Dotify.ipa Payload && ls -lh Dotify.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Dotify-ipa
          path: out/Dotify.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dotify-ios-${{ github.run_number }}
          name: Dotify iOS build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: out/Dotify.ipa
          body: Неподписанный IPA. Установка через Sideloadly / AltStore / Feather.
